# Centralised ordinal -> numeric mappings (IMPLEMENTATION_SPEC.md §16, §20, §23).
#
# THESE ARE PLACEHOLDERS. They are not calibrated and must not be tuned on the
# 20-case development slice. Calibration happens later on a held-out validation
# set via `src.inference.parameters.fit_calibration`.
#
# No numeric value from this file may be duplicated in Python code.

version: v0-placeholder

# f_theta: ordinal implication label -> P(X_v = 1 | X_u = 1)
# Used by the consequence-graph verifier (milestone 2). Unused in milestone 1.
edge_probabilities:
  strongly_implied: 0.95
  implied: 0.80
  weakly_implied: 0.65
  neutral: 0.50
  unlikely: 0.30
  strongly_contradicted: 0.10

# g_phi: ordinal evidence label -> log P(D_v | X_v = 1) / P(D_v | X_v = 0)
#
# INVARIANT (IMPLEMENTATION_SPEC.md §20, §35.5): no_evidence must stay at 0.0.
# Failure to retrieve literature must not count against a hypothesis, and is
# semantically distinct from `mixed` (conflicting evidence was actually found).
evidence_log_lr:
  strong_support: 2.0
  support: 1.2
  weak_support: 0.5
  mixed: 0.0
  weak_contradiction: -0.5
  contradiction: -1.2
  strong_contradiction: -2.0
  no_evidence: 0.0
