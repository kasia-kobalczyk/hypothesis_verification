<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM cost — hypothesis verification</title>
<style>
  .viz-root, body {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --gridline: #e1e0d9;
    --baseline: #c3c2b7;
    --series-1: #2a78d6;
    --border: rgba(11, 11, 11, 0.10);
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root,
    :root:where(:not([data-theme="light"])) body {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --gridline: #2c2c2a;
      --baseline: #383835;
      --series-1: #3987e5;
      --border: rgba(255, 255, 255, 0.10);
    }
  }
  :root[data-theme="dark"] .viz-root, :root[data-theme="dark"] body {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --gridline: #2c2c2a;
    --baseline: #383835;
    --series-1: #3987e5;
    --border: rgba(255, 255, 255, 0.10);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding-block: 28px; padding-inline: 20px; }

  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 12px; color: var(--text-secondary);
       text-transform: uppercase; letter-spacing: 0.04em; }
  .live { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 7px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  .dot.stale { background: var(--warning); }

  .banner {
    margin: 16px 0 0; padding: 10px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-1);
    display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--text-secondary);
  }
  .banner b { color: var(--text-primary); }
  .banner .icon { flex: none; font-size: 14px; line-height: 1.4; }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .hero { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 24px; }
  .hero-figure { font-size: 52px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
  .hero-label { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }

  .kpis { margin-top: 16px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .kpi-value { font-size: 24px; font-weight: 600; line-height: 1.2; }
  .kpi-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .kpi-note { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

  section { margin-top: 24px; }
  figure { margin: 0; }
  figcaption { font-size: 12px; color: var(--text-muted); margin-top: 10px; }
  .chart-wrap { position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .grid line { stroke: var(--gridline); stroke-width: 1; shape-rendering: crispEdges; }
  .axis line { stroke: var(--baseline); stroke-width: 1; shape-rendering: crispEdges; }
  .tick { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .bar { fill: var(--series-1); }
  .bar-label { fill: var(--text-secondary); font-size: 11px; font-weight: 600;
                font-variant-numeric: tabular-nums; text-anchor: middle; }
  .hit { fill: transparent; cursor: pointer; }
  .hit:hover + .bar, .hit:focus-visible + .bar { fill-opacity: 0.82; }

  .tooltip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity 90ms ease;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px;
    font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.16); min-width: 150px; z-index: 4;
  }
  .tooltip.on { opacity: 1; }
  .tooltip .t-day { font-weight: 600; margin-bottom: 5px; }
  .tooltip dl { margin: 0; display: grid; grid-template-columns: auto auto; gap: 2px 14px; }
  .tooltip dt { color: var(--text-secondary); }
  .tooltip dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--gridline); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-secondary); font-weight: 600; font-size: 12px; }
  td { font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: none; }
  tfoot td { font-weight: 600; border-top: 1px solid var(--baseline); border-bottom: none; }
  .tables { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .scroll { overflow-x: auto; }
  .muted { color: var(--text-muted); }
  details { margin-top: 10px; }
  summary { cursor: pointer; font-size: 13px; color: var(--text-secondary); }
  footer { margin-top: 28px; font-size: 12px; color: var(--text-muted); }
  .status-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
                 font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); }
</style>
</head>
<body class="viz-root">
<div class="wrap">
  <header>
    <div>
      <h1>LLM cost — hypothesis verification</h1>
      <div class="muted" style="font-size:12px;margin-top:4px">
        Every model call the project has logged, priced and totalled.
      </div>
    </div>
    <div class="live"><span class="dot" id="dot"></span><span id="updated">loading…</span></div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="card hero">
    <div>
      <div class="hero-figure" id="hero">$0.00</div>
      <div class="hero-label" id="hero-label">project total</div>
    </div>
    <div id="budget-block"></div>
  </div>

  <div class="kpis" id="kpis"></div>

  <section>
    <h2>Spend per day</h2>
    <div class="card">
      <figure>
        <div class="chart-wrap">
          <div id="chart"></div>
          <div class="tooltip" id="tip" role="status" aria-live="polite"></div>
        </div>
        <figcaption id="chart-caption"></figcaption>
      </figure>
    </div>
  </section>

  <section>
    <h2>Breakdown</h2>
    <div class="tables">
      <div class="card"><div class="scroll"><table id="t-purpose"></table></div></div>
      <div class="card"><div class="scroll"><table id="t-model"></table></div></div>
    </div>
    <details>
      <summary>Per run, and the full daily table</summary>
      <div class="tables" style="margin-top:14px">
        <div class="card"><div class="scroll"><table id="t-run"></table></div></div>
        <div class="card"><div class="scroll"><table id="t-daily"></table></div></div>
      </div>
    </details>
  </section>

  <footer id="footer"></footer>
</div>

<script>
const REFRESH_MS = 10000;
let lastData = null, lastFetch = null;

const usd = (v, digits) => "$" + (v || 0).toLocaleString("en-US",
  {minimumFractionDigits: digits === undefined ? 2 : digits, maximumFractionDigits: digits === undefined ? 2 : digits});
const num = (v) => (v || 0).toLocaleString("en-US");
const esc = (s) => String(s === null || s === undefined ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const STATUS = {
  good: {icon: "●", label: "within budget", color: "var(--good)"},
  warning: {icon: "◐", label: "over half spent", color: "var(--warning)"},
  serious: {icon: "◑", label: "approaching budget", color: "var(--serious)"},
  critical: {icon: "■", label: "over budget", color: "var(--critical)"},
};

/* ---------- daily series, with empty days filled in ---------- */
function densify(daily) {
  const rows = daily.filter(d => d.day && d.day !== "unknown")
                    .sort((a, b) => a.day < b.day ? -1 : 1);
  if (!rows.length) return [];
  const out = [];
  const cursor = new Date(rows[0].day + "T00:00:00Z");
  const end = new Date(rows[rows.length - 1].day + "T00:00:00Z");
  const byDay = new Map(rows.map(r => [r.day, r]));
  while (cursor <= end) {
    const key = cursor.toISOString().slice(0, 10);
    out.push(byDay.get(key) || {day: key, cost_usd: 0, calls: 0, total_tokens: 0,
                                prompt_tokens: 0, completion_tokens: 0, unpriced_calls: 0});
    cursor.setUTCDate(cursor.getUTCDate() + 1);
  }
  return out;
}

/* rounded top, square base - the data-end is the rounded end */
function barPath(x, y, w, h, r) {
  const radius = Math.max(0, Math.min(r, w / 2, h));
  if (h <= 0) return "";
  return `M${x},${y + h} L${x},${y + radius} Q${x},${y} ${x + radius},${y}` +
         ` L${x + w - radius},${y} Q${x + w},${y} ${x + w},${y + radius}` +
         ` L${x + w},${y + h} Z`;
}

function niceTicks(max) {
  if (max <= 0) return [0, 1];
  const pow = Math.pow(10, Math.floor(Math.log10(max)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * pow).find(s => max / s <= 4) || pow * 10;
  const ticks = [];
  for (let v = 0; v <= max * 1.0001 + step / 2; v += step) ticks.push(Number(v.toFixed(10)));
  return ticks;
}

function renderChart(data) {
  const host = document.getElementById("chart");
  const tip = document.getElementById("tip");
  const rows = densify(data.daily);
  if (!rows.length) { host.innerHTML = '<p class="muted">No calls logged yet.</p>'; return; }

  const width = Math.max(320, host.clientWidth || 860);
  const height = 260;
  const pad = {top: 22, right: 12, bottom: 30, left: 58};
  const plotW = width - pad.left - pad.right;
  const plotH = height - pad.top - pad.bottom;
  const maxCost = Math.max(...rows.map(r => r.cost_usd), 0);
  const ticks = niceTicks(maxCost);
  const top = ticks[ticks.length - 1] || 1;
  const y = v => pad.top + plotH - (v / top) * plotH;
  const band = plotW / rows.length;
  const barW = Math.max(2, Math.min(64, band - 2)); /* 2px surface gap between bars */

  const maxIdx = rows.reduce((best, r, i) => r.cost_usd > rows[best].cost_usd ? i : best, 0);
  const lastIdx = rows.length - 1;
  const labelEvery = Math.ceil(rows.length / Math.max(2, Math.floor(plotW / 76)));

  const parts = [];
  parts.push(`<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Spend per day in US dollars">`);
  parts.push('<g class="grid">');
  ticks.forEach(t => parts.push(`<line x1="${pad.left}" x2="${width - pad.right}" y1="${y(t)}" y2="${y(t)}"/>`));
  parts.push("</g>");
  ticks.forEach(t => parts.push(
    `<text class="tick" x="${pad.left - 9}" y="${y(t) + 4}" text-anchor="end">${esc(usd(t, t < 1 ? 2 : 0))}</text>`));

  rows.forEach((r, i) => {
    const x = pad.left + i * band + (band - barW) / 2;
    const h = r.cost_usd > 0 ? Math.max(2, plotH - (y(r.cost_usd) - pad.top)) : 0;
    const yTop = pad.top + plotH - h;
    parts.push(`<rect class="hit" x="${pad.left + i * band}" y="${pad.top}" width="${band}" height="${plotH}"
       tabindex="0" data-i="${i}" aria-label="${esc(r.day)}: ${esc(usd(r.cost_usd, 4))}"></rect>`);
    if (h > 0) parts.push(`<path class="bar" d="${barPath(x, yTop, barW, h, 4)}"/>`);
    if (i === maxIdx || i === lastIdx) {
      parts.push(`<text class="bar-label" x="${x + barW / 2}" y="${yTop - 7}">${esc(usd(r.cost_usd, r.cost_usd < 1 ? 2 : 0))}</text>`);
    }
    if (i % labelEvery === 0 || i === lastIdx) {
      parts.push(`<text class="tick" x="${pad.left + i * band + band / 2}" y="${height - 10}" text-anchor="middle">${esc(r.day.slice(5))}</text>`);
    }
  });

  parts.push(`<g class="axis"><line x1="${pad.left}" x2="${width - pad.right}" y1="${y(0)}" y2="${y(0)}"/></g>`);
  parts.push("</svg>");
  host.innerHTML = parts.join("");

  host.querySelectorAll(".hit").forEach(hit => {
    const show = () => {
      const r = rows[+hit.dataset.i];
      tip.innerHTML =
        `<div class="t-day">${esc(r.day)}</div><dl>` +
        `<dt>cost</dt><dd>${esc(usd(r.cost_usd, 4))}</dd>` +
        `<dt>calls</dt><dd>${esc(num(r.calls))}</dd>` +
        `<dt>tokens</dt><dd>${esc(num(r.total_tokens))}</dd>` +
        (r.unpriced_calls ? `<dt>unpriced</dt><dd>${esc(num(r.unpriced_calls))}</dd>` : "") +
        `</dl>`;
      const box = hit.getBoundingClientRect();
      const wrap = host.parentElement.getBoundingClientRect();
      tip.classList.add("on");
      const left = box.left - wrap.left + box.width / 2 - tip.offsetWidth / 2;
      tip.style.left = Math.max(0, Math.min(left, wrap.width - tip.offsetWidth)) + "px";
      tip.style.top = Math.max(0, box.top - wrap.top - tip.offsetHeight - 8) + "px";
    };
    hit.addEventListener("mouseenter", show);
    hit.addEventListener("focus", show);
    hit.addEventListener("mouseleave", () => tip.classList.remove("on"));
    hit.addEventListener("blur", () => tip.classList.remove("on"));
  });

  document.getElementById("chart-caption").textContent =
    rows.length === 1
      ? "One day of activity so far — the trend builds as more runs land."
      : `${rows.length} days, ${usd(maxCost, 2)} on the heaviest day. Hover or tab a column for detail.`;
}

function table(el, rows, keyName, keyLabel) {
  const total = rows.reduce((a, r) => a + (r.cost_usd || 0), 0);
  const totalCalls = rows.reduce((a, r) => a + r.calls, 0);
  const totalTokens = rows.reduce((a, r) => a + r.total_tokens, 0);
  const body = rows
    .slice()
    .sort((a, b) => (b.cost_usd || 0) - (a.cost_usd || 0))
    .map(r => `<tr><td>${esc(r[keyName] === null ? "—" : r[keyName])}${
        r.unpriced_calls ? ' <span class="muted">(unpriced)</span>' : ""
      }</td><td>${esc(usd(r.cost_usd, 4))}</td><td>${esc(num(r.calls))}</td><td>${esc(num(r.total_tokens))}</td></tr>`)
    .join("");
  el.innerHTML =
    `<thead><tr><th>${esc(keyLabel)}</th><th>cost</th><th>calls</th><th>tokens</th></tr></thead>` +
    `<tbody>${body || '<tr><td colspan="4" class="muted">nothing yet</td></tr>'}</tbody>` +
    `<tfoot><tr><td>total</td><td>${esc(usd(total, 4))}</td><td>${esc(num(totalCalls))}</td><td>${esc(num(totalTokens))}</td></tr></tfoot>`;
}

function render(data) {
  lastData = data;
  const t = data.totals;

  document.getElementById("hero").textContent = usd(t.cost_usd, 2);
  document.getElementById("hero-label").textContent =
    `project total across ${num(t.calls)} model calls` +
    (data.pricing.verified ? "" : " (estimate)");

  const b = data.budget;
  const budgetEl = document.getElementById("budget-block");
  if (b && b.budget_usd) {
    const s = STATUS[b.status] || STATUS.good;
    budgetEl.innerHTML =
      `<div class="status-pill" style="color:${s.color}"><span aria-hidden="true">${s.icon}</span>` +
      `<span>${esc(s.label)}</span></div>` +
      `<div class="kpi-note">${esc(usd(b.spent_usd))} of ${esc(usd(b.budget_usd))} · ` +
      `${esc(usd(Math.max(0, b.remaining_usd)))} left</div>`;
  } else {
    budgetEl.innerHTML = '<div class="kpi-note">No budget set — add <code>cost.budget_usd</code> to the config.</div>';
  }

  const kpis = [
    {value: usd(data.today.cost_usd, 2), label: "today (UTC)", note: `${num(data.today.calls)} calls`},
    {value: num(t.total_tokens), label: "tokens all time",
     note: `${num(t.prompt_tokens)} in · ${num(t.completion_tokens)} out`},
    {value: num(t.calls), label: "model calls", note: `over ${num(t.n_days)} day(s)`},
    {value: t.calls ? usd(t.cost_usd / t.calls, 4) : usd(0, 4), label: "mean cost per call",
     note: t.unpriced_calls ? `${num(t.unpriced_calls)} unpriced` : "all calls priced"},
  ];
  document.getElementById("kpis").innerHTML = kpis.map(k =>
    `<div class="card"><div class="kpi-value">${esc(k.value)}</div>` +
    `<div class="kpi-label">${esc(k.label)}</div><div class="kpi-note">${esc(k.note)}</div></div>`).join("");

  const banner = document.getElementById("banner");
  const notes = [];
  if (!data.pricing.verified) {
    notes.push("<b>Rates are unverified.</b> " + esc(data.pricing.source) +
      " — treat every figure as an estimate until <code>configs/pricing.yaml</code> is checked against the Azure agreement and marked <code>verified: true</code>.");
  }
  if (t.unpriced_calls) {
    notes.push(`<b>${num(t.unpriced_calls)} call(s) have no price</b> (${esc(t.unpriced_models.join(", "))}). ` +
      "Their tokens are counted; their cost is not, so the total is a floor.");
  }
  banner.hidden = notes.length === 0;
  banner.innerHTML = notes.length
    ? '<span class="icon" aria-hidden="true">⚠</span><div>' + notes.join("<br><br>") + "</div>"
    : "";

  renderChart(data);
  table(document.getElementById("t-purpose"), data.by_purpose, "purpose", "method / purpose");
  table(document.getElementById("t-model"), data.by_model, "model", "model");
  table(document.getElementById("t-run"), data.by_run, "run_id", "run");
  table(document.getElementById("t-daily"), data.daily, "day", "day (UTC)");

  document.getElementById("footer").innerHTML =
    `Prices ${esc(data.pricing.version)} from ${esc(data.pricing.path || "configs/pricing.yaml")}. ` +
    `Ledger is durable: costs survive deleting <code>runs/</code>. ` +
    `First call ${esc(t.first_call || "—")}, last ${esc(t.last_call || "—")}.`;
}

function tick() {
  if (!lastFetch) return;
  const age = Math.round((Date.now() - lastFetch) / 1000);
  document.getElementById("updated").textContent =
    age < 5 ? "live · just now" : `live · updated ${age}s ago`;
  document.getElementById("dot").classList.toggle("stale", age > REFRESH_MS / 1000 * 3);
}

async function refresh() {
  try {
    const res = await fetch("api/costs.json", {cache: "no-store"});
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json());
    lastFetch = Date.now();
    tick();
  } catch (err) {
    document.getElementById("updated").textContent = "refresh failed: " + err.message;
    document.getElementById("dot").classList.add("stale");
  }
}

if (window.__COSTS__) {                 /* static export */
  render(window.__COSTS__);
  document.getElementById("updated").textContent = "static snapshot · " + window.__COSTS__.generated_at;
  document.getElementById("dot").classList.add("stale");
} else {
  refresh();
  setInterval(refresh, REFRESH_MS);
  setInterval(tick, 1000);
}
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => lastData && renderChart(lastData), 150);
});
</script>
</body>
</html>
